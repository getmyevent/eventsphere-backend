spring:
  application:
    name: eventsphere-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

eventsphere:
  jwt:
    secret: "${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}" # 256-bit dev secret
    expiration-ms: ${JWT_EXPIRATION_MS:259200000} # 72 hours (3 days)
  security:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
