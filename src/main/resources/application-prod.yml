spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EventSphereProdHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 3000
      idle-timeout: 120000
      max-lifetime: 180000
      keepalive-time: 30000
      validation-timeout: 2000
      leak-detection-threshold: 60000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        connectTimeout: 5000
        socketTimeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:10000}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

eventsphere:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZXZlbnRzcGhlcmUtYmFja2VuZC0yNTYtYml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:259200000}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mpss26.eventsphere.com}
    rate-limit:
      ip-per-minute: ${RATE_LIMIT_IP:600}
      mobile-per-minute: ${RATE_LIMIT_MOBILE:10}

logging:
  level:
    root: INFO
    com.eventsphere: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
